pipeline:
  - step: 1
    name: "brief-intake"
    type: "checkpoint"
    output_file: "squads/lp-generator/output/{run}/brief.md"
    # Body do checkpoint coleta: produto/oferta, público-alvo + awareness, tom desejado,
    # URLs de referência (opcional), seções obrigatórias, restrições especiais, sugestão de stack (opcional)

  - step: 2
    name: "analyze-and-strategize"
    type: "agent"
    agent: "bruno-briefing"
    execution: "inline"
    input_file: "squads/lp-generator/output/{run}/brief.md"
    output_file: "squads/lp-generator/output/{run}/strategy.md"

  - step: 3
    name: "approve-strategy"
    type: "checkpoint"
    # Apresenta strategy.md para aprovação antes de gastar tokens em copy/visual/dev

  - step: 4
    name: "write-copy"
    type: "agent"
    agent: "carla-copy"
    execution: "inline"
    format: "copywriting"
    input_file: "squads/lp-generator/output/{run}/strategy.md"
    output_file: "squads/lp-generator/output/{run}/copy.md"

  - step: 5
    name: "design-visual"
    type: "agent"
    agent: "diana-design"
    execution: "inline"
    format: "image-design"
    input_file: "squads/lp-generator/output/{run}/strategy.md"
    output_file: "squads/lp-generator/output/{run}/visual-system.md"
    # Também produz images/ folder

  - step: 6
    name: "build-code"
    type: "agent"
    agent: "davi-dev"
    execution: "inline"
    input_file: "squads/lp-generator/output/{run}/copy.md"
    output_file: "squads/lp-generator/output/{run}/code/"

  - step: 7
    name: "approve-content"
    type: "checkpoint"
    # Mostra code/ preview + copy + visual para aprovação antes da review final

  - step: 8
    name: "review"
    type: "agent"
    agent: "rita-revisao"
    execution: "inline"
    output_file: "squads/lp-generator/output/{run}/review.md"
    on_reject: 6  # default: volta para Davi; review.md indica explicitamente se é melhor voltar para 4 ou 5

  - step: 9
    name: "final-approval"
    type: "checkpoint"
    # Entrega final ao Patrick com link para code/

investigation:
  enriched: false  # discovery.investigation.enabled era false

research_brief: |
  LP Generator — Research Brief (Phase B)

  1. FRAMEWORKS DE CONVERSÃO PARA LP
     - StoryBrand: cliente é o herói, marca é o guia. Estrutura: personagem → problema → guia → plano → CTA → sucesso → fracasso evitado. Excelente para LPs de marca/curso/coaching.
     - AIDA: Atenção → Interesse → Desejo → Ação. Padrão clássico, melhor para top-funnel e produtos novos.
     - PAS: Problem → Agitate → Solution. Mais forte emocionalmente. Ideal para dor aguda e diária do público.
     - 4Ps: Promise → Picture → Proof → Push. Melhor para conversão direta (trial, compra).
     - Hero anatomy 2026: headline benefit-driven, sub-headline com mecanismo, 1 CTA primário, 1 social proof, visual que comunica o produto.

  2. EXEMPLOS DE LPS QUE CONVERTEM
     - Stripe: gradiente animado, snippets de código mostrando complexidade técnica como atrativo.
     - Linear: especificidade radical — copy direta para devs frustrados com Jira. Filtro de auto-seleção.
     - Notion: simplicidade radical — uma frase só no hero, demo embedada.
     - Vercel: identidade visual para devs sofisticados, animações, hover-to-preview em snippets.
     - Padrão comum: value prop forte + 1 CTA + social proof + zero ruído acima da dobra.

  3. ANTI-PATTERNS (MISTAKES COMUNS)
     - Múltiplos CTAs concorrentes no hero (decision fatigue).
     - Stock photos genéricos (corporate handshake) — destrói credibilidade.
     - Hero com mensagens demais: 1 promessa, não 3.
     - Imagens grandes não otimizadas: LCP > 3s mata conversão.
     - "Click here" / "Saiba mais" como anchor text: zero SEO context, CTA vago.
     - Social proof sem especificidade: "vários clientes felizes" perde para "8 das Fortune 50".
     - Mismatch entre anúncio que trouxe o tráfego e título da LP.

  4. QUALITY CRITERIA (BENCHMARKS)
     - Above-the-fold: CTA visível em 375px mobile sem scroll.
     - Tap targets >= 48px.
     - Body text >= 16px mobile.
     - LCP < 2.5s (2s de atraso = 50% de queda de conversão).
     - CLS < 0.1.
     - Lighthouse mobile Performance > 90, Accessibility > 95.
     - 80% dos visitantes leem só headline + subheadline antes de decidir continuar.
     - 57% nunca scrollam abaixo da primeira viewport no desktop, 64% no mobile.

  5. CODE PATTERNS MODERNOS
     - HTML + Tailwind CDN single-file: ideal para LP simples, 1 página, sem form complexo. Performance excelente quando bem implementado.
     - Astro: melhor Lighthouse score absoluto da categoria, zero JS por padrão, ótimo para multi-página + blog.
     - Next.js App Router: padrão para LPs com server actions, A/B testing, conteúdo dinâmico, auth. React Server Components + Tailwind.
     - Componente base: shadcn/ui é o padrão de fato para Next.js LP.

