# Netlify config — Visttor landing page (static, no build)
[build]
  publish = "."
  # Só publica quando algo na pasta do Visttor muda (monorepo multi-cliente).
  # Sai 0 (sem mudanças) => Netlify cancela o build; sai 1 => build roda.
  ignore = "git diff --quiet HEAD^ HEAD ."

# Long cache for fingerprint-stable assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
