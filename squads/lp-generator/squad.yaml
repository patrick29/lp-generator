code: "lp-generator"
name: "LP Generator"
description: "Transforma um briefing curto em uma landing page completa e pronta para uso, com stack escolhida por LP (HTML+Tailwind single-file por padrão, escalando para Astro ou Next.js quando a complexidade exigir)."

language: "pt-BR"
domain: "content"

# Skills disponíveis para os agentes
skills:
  - webfetch          # built-in — Bruno analisa URLs de referência
  - template-designer # Diana gera referência visual / single-slide hero
  - image-fetcher     # Diana puxa logos, fotos stock, retratos reais
  - image-ai-generator # Diana gera hero, product shots, ilustrações custom

# Formatos best-practice usados em steps de criação de conteúdo
# (injetados pelo Pipeline Runner via campo `format:` no frontmatter dos steps)
formats:
  - copywriting   # usado por carla-copy no step write-copy
  - image-design  # usado por diana-design no step design-visual
  - blog-seo      # apoio adjacente (SEO técnico para a meta)
  - review        # apoio adjacente (rubrica de revisão)

# Materiais de referência carregados como conhecimento do squad
data:
  - pipeline/data/research-brief.md
  - pipeline/data/domain-framework.md
  - pipeline/data/quality-criteria.md
  - pipeline/data/output-examples.md
  - pipeline/data/anti-patterns.md
  - pipeline/data/tone-of-voice.md

# Entry point do pipeline
pipeline: pipeline/pipeline.yaml

# Manifesto dos agentes
party: squad-party.csv
