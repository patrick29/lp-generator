# Notes / judgment calls do design
design_notes:
  - "Pipeline 100% inline (zero subagentes): fonte é fixa (briefing), não há paralelismo, contexto rico entre agentes é mais útil que paralelismo."
  - "Sem padrão news-based (sem generate-angles step): angle se manifesta como hooks A/B/C dentro do step de copy."
  - "Não há best-practice 'landing-page' instalado; usamos copywriting + image-design + blog-seo + review como apoio adjacente. Vale criar landing-page.md no futuro."
  - "on_reject default da Rita é step 6 (build); o review.md indica explicitamente se a falha foi em copy (step 4) ou visual (step 5), e o pipeline runner deve respeitar essa indicação se suportar on_reject dinâmico."
