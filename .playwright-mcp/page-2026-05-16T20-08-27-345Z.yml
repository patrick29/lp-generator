            - generic [ref=e536]: "01"
            - generic [ref=e537]: A Nova é uma agência recente. O que isso significa pra mim?
          - paragraph [ref=e542]: "Significa proximidade real entre quem decide e quem executa, sem camada de intermediário. O time é pequeno por escolha: aplicar estratégia com excelência exige cadência curta entre plano, leitura e ajuste. O custo de uma agência grande é diluído em pirâmide; aqui é direcionado pra aplicar estratégia no seu projeto."
        - listitem [ref=e543]:
          - button "02 Como funciona o atendimento no dia a dia?" [ref=e544] [cursor=pointer]:
            - generic [ref=e545]: "02"
            - generic [ref=e546]: Como funciona o atendimento no dia a dia?
          - generic:
            - paragraph: "Você conversa diretamente com o time que está com a mão no projeto: reuniões de leitura na cadência combinada, decisões registradas, ajustes implementados rápido quando o número pede. Sem repasse de e-mail entre camadas, sem \"vou checar com a área\"."
        - listitem [ref=e550]:
          - button "03 Como vocês compensam ter um time pequeno?" [ref=e551] [cursor=pointer]:
            - generic [ref=e552]: "03"
            - generic [ref=e553]: Como vocês compensam ter um time pequeno?
          - generic:
            - paragraph: Time pequeno é estrutura, não desvantagem. Todo mundo na Nova lê o mesmo painel e fala com o mesmo cliente. Para escopo que pede braço extra (produção pesada, peças por volume), trabalhamos com parceiros de confiança, sempre coordenados pela estratégia da casa.
        - listitem [ref=e557]:
          - button "04 Quanto tempo até ver resultado?" [ref=e558] [cursor=pointer]:
            - generic [ref=e559]: "04"
            - generic [ref=e560]: Quanto tempo até ver resultado?
          - generic:
            - paragraph: "Mídia paga bem feita responde em 30 a 60 dias. Branding e posicionamento, 90 dias pra começar a virar percepção. Crescimento orgânico, 6 a 12 meses. A gente fala isso desde o primeiro briefing: não vendemos milagre, vendemos método aplicado."
        - listitem [ref=e564]:
          - button "05 Como funciona o contrato?" [ref=e565] [cursor=pointer]:
            - generic [ref=e566]: "05"
            - generic [ref=e567]: Como funciona o contrato?
          - generic:
            - paragraph: Mensal, com escopo claro e revisão trimestral. Sem fidelidade longa, sem pegadinha. A ideia é que o cliente fique porque o trabalho está rendendo no painel, não porque a cláusula obriga.
        - listitem [ref=e571]:
          - button "06 Como é a primeira conversa?" [ref=e572] [cursor=pointer]:
            - generic [ref=e573]: "06"
            - generic [ref=e574]: Como é a primeira conversa?
          - generic:
            - paragraph: Uma call de 30 minutos, sem custo. A gente entende o cenário e diz, ali mesmo, se faz sentido seguir. Se não fizer, te indicamos quem pode ajudar melhor. Aqui a gente prefere cliente certo a cliente cheio.
