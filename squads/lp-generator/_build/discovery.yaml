squad_code: "lp-generator"
purpose: "Gerar landing pages completas (código pronto) a partir de um briefing curto. Cada LP pode ter público, tom e nível de complexidade próprios; o squad decide a stack (HTML+Tailwind single-file, Astro ou Next.js) conforme o briefing."
domain: "content"

company:
  name: "LP Generator (projeto pessoal de Patrick Almeida)"
  tone: "Adaptável por LP — sem identidade de marca fixa"
  products: "Landing pages sob demanda"

language: "pt-BR"

context:
  audience: "Variável — cada LP tem público próprio. O squad pergunta/infere a partir do briefing antes de gerar."
  platforms: "Web (landing page) — entregável é código pronto. Stack escolhida por LP: padrão HTML+Tailwind single-file; Astro/Next.js quando a complexidade pedir."
  tone: "Adaptado ao briefing e ao produto/oferta de cada LP."

tools_needed:
  - template-designer
  - image-fetcher
  - image-ai-generator
  - webfetch  # built-in — para analisar URLs de referência passadas no briefing

investigation:
  enabled: false
  profiles: []

target_formats:
  - copywriting
  - image-design
  - blog-seo

notes:
  - "Não existe um best-practice 'landing-page' instalado. As referências escolhidas (copywriting, image-design, blog-seo) servem como base de conhecimento adjacente."
  - "Stack de saída é decisão por LP: o squad deve avaliar complexidade do briefing antes de escolher entre HTML+Tailwind single-file (padrão) ou Astro/Next.js."
  - "Sem investigação prévia: o squad pode receber URLs de referência por briefing e analisar via WebFetch on-demand."
